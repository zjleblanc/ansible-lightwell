---
- name: Ensure application source directory exists on the build host
  ansible.builtin.stat:
    path: "{{ app_source_dir }}"
  register: app_source_stat

- name: Fail if application source is missing
  ansible.builtin.fail:
    msg: >-
      Application source not found at {{ app_source_dir }}. This role
      expects to run against a checkout of the ansible-lightwell repository
      (e.g. the AAP project working directory).
  when: not app_source_stat.stat.exists

- name: Create a secure temporary netrc file for Lightwell authentication
  ansible.builtin.tempfile:
    state: file
    suffix: netrc
  register: lightwell_netrc_file

- name: Write Lightwell Network credentials to the temporary netrc file
  ansible.builtin.copy:
    dest: "{{ lightwell_netrc_file.path }}"
    content: |
      machine {{ lightwell_registry_host }}
      login {{ lightwell_username }}
      password {{ lightwell_password }}
    mode: "0600"
  no_log: true

- name: Build the application container image
  containers.podman.podman_image:
    name: "{{ app_image_registry }}/{{ app_image_name }}"
    tag: "{{ app_image_tag }}"
    path: "{{ app_source_dir }}"
    build:
      file: Containerfile
      force_rm: true
      extra_args: "--secret id=netrc,src={{ lightwell_netrc_file.path }}"
  register: build_result

- name: Remove the temporary netrc file
  ansible.builtin.file:
    path: "{{ lightwell_netrc_file.path }}"
    state: absent
  no_log: true

- name: Tag the image for the target environment
  ansible.builtin.command:
    cmd: >-
      podman tag {{ app_image_registry }}/{{ app_image_name }}:{{ app_image_tag }}
      {{ app_image_registry }}/{{ app_image_name }}:{{ app_environment }}-latest
  changed_when: true

- name: Push the built image(s) to the registry
  ansible.builtin.command:
    cmd: "podman push {{ app_image_registry }}/{{ app_image_name }}:{{ item }}"
  loop:
    - "{{ app_image_tag }}"
    - "{{ app_environment }}-latest"
  changed_when: true
  when: app_image_push | bool
