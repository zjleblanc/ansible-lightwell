---
# pip resolves the Lightwell Remediated index via a .netrc entry (see
# apps/python/requirements.txt's --index-url).
- name: Write Lightwell Network credentials to the build-context netrc file
  no_log: "{{ build_app_no_log }}"
  ansible.builtin.copy:
    dest: "{{ remote_build_dir.path }}/.netrc"
    content: |
      machine {{ lightwell_registry_host }}
      login {{ lightwell_username }}
      password {{ lightwell_password }}
    mode: "0600"
