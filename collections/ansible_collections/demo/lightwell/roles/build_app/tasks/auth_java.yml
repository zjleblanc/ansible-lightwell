---
# Maven resolves the Lightwell Remediated index via a <server> credential in
# settings.xml (see apps/java/pom.xml's "lightwell-remediated" repository id).
- name: Write Lightwell Network credentials to the build-context Maven settings.xml
  no_log: "{{ build_app_no_log }}"
  ansible.builtin.copy:
    dest: "{{ remote_build_dir.path }}/settings.xml"
    content: |
      <settings>
        <servers>
          <server>
            <id>lightwell-remediated</id>
            <username>{{ lightwell_username }}</username>
            <password>{{ lightwell_password }}</password>
          </server>
        </servers>
      </settings>
    mode: "0600"
