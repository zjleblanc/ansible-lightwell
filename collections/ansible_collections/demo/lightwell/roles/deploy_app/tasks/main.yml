---
- name: Ensure the rollback state directory exists
  become: true
  ansible.builtin.file:
    path: "{{ app_previous_image_file | dirname }}"
    state: directory
    mode: "0755"

- name: Capture the currently running container, if any
  register: current_container_info
  failed_when: false
  containers.podman.podman_container_info:
    name: "{{ app_container_name }}"

- name: Record the previous image reference as a fact
  ansible.builtin.set_fact:
    previous_app_image: >-
      {{ current_container_info.containers[0].Config.Image
         if (current_container_info.containers is defined and current_container_info.containers | length > 0)
         else '' }}

- name: Persist the previous image reference for use by the rollback role
  when: previous_app_image | length > 0
  become: true
  ansible.builtin.copy:
    dest: "{{ app_previous_image_file }}"
    content: "{{ previous_app_image }}"
    mode: "0644"

- name: Pull the target application image, authenticating via the registry auth file if provided
  block:
    - name: Create a temporary file for the registry auth file on the target host
      when: registry_auth_file is defined
      register: registry_auth_tempfile
      ansible.builtin.tempfile:
        state: file
        suffix: -registry-auth.json

    - name: Write the registry auth file to the target host
      when: registry_auth_file is defined
      no_log: "{{ deploy_app_no_log }}"
      ansible.builtin.copy:
        src: "{{ registry_auth_file }}"
        dest: "{{ registry_auth_tempfile.path }}"
        mode: "0600"

    - name: Pull the target application image
      containers.podman.podman_image:
        name: "{{ app_image_registry }}/{{ app_image_name }}"
        tag: "{{ app_image_tag }}"
        pull: true
        auth_file: "{{ registry_auth_tempfile.path | default(omit) }}"
  always:
    - name: Remove the temporary registry auth file
      when: registry_auth_tempfile is defined and registry_auth_tempfile.path is defined
      ansible.builtin.file:
        path: "{{ registry_auth_tempfile.path }}"
        state: absent

- name: Deploy the application container
  register: deploy_result
  containers.podman.podman_container:
    name: "{{ app_container_name }}"
    image: "{{ app_image_registry }}/{{ app_image_name }}:{{ app_image_tag }}"
    state: started
    recreate: true
    ports:
      - "{{ app_host_port }}:8080"
    restart_policy: always
    env:
      PORT: "8080"
      APP_ENVIRONMENT: "{{ app_environment }}"

- name: Generate a systemd unit for the application container
  when: manage_systemd_unit | bool
  become: true
  containers.podman.podman_generate_systemd:
    name: "{{ app_container_name }}"
    dest: "{{ systemd_unit_dir }}"
    restart_policy: always
    new: true

- name: Reload systemd and enable the generated unit
  when: manage_systemd_unit | bool
  become: true
  ansible.builtin.systemd:
    name: "container-{{ app_container_name }}.service"
    daemon_reload: true
    enabled: true
