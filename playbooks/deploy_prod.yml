---
# Triggered by the AAP job template webhook on GitHub push events to main,
# after the corresponding PR passed test deployment and was approved and
# merged. Deploys the same tested image to prod, health-checks it, and
# automatically rolls back to the previous version on failure.
- name: Deploy the Lightwell demo application to production
  hosts: prod
  gather_facts: true
  vars:
    app_environment: prod
  roles:
    - role: demo.lightwell.deploy_app
  tasks:
    - name: Run the post-deploy health check
      ansible.builtin.include_role:
        name: demo.lightwell.health_check
      vars:
        health_check_strict: false

    - name: Record the initial deployment health result
      ansible.builtin.set_fact:
        initial_health_check_passed: "{{ health_check_passed }}"

    - name: Roll back automatically when the initial health check fails
      ansible.builtin.include_role:
        name: demo.lightwell.rollback
      when: not initial_health_check_passed

    - name: Fail the play if the service is still unhealthy after any rollback attempt
      ansible.builtin.fail:
        msg: >-
          Production deployment of {{ app_image_registry }}/{{ app_image_name }}:{{ app_image_tag }}
          failed health checks{{ ' -- rolled back to ' ~ rollback_image if not initial_health_check_passed and rollback_image is defined else '' }}.
      when: not health_check_passed
