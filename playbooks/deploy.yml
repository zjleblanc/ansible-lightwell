---
- name: Build the Lightwell demo application image
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check whether the PR touches app/ files (Test only)
      when:
        - app_environment == 'test'
        - github_token is defined
        - github_repo_full_name is defined
        - github_pr_number is defined
      block:
        - name: Fetch the list of files changed in the pull request
          register: pr_files_result
          ansible.builtin.uri:
            url: "{{ github_api_url | default('https://api.github.com') }}/repos/{{ github_repo_full_name }}/pulls/{{ github_pr_number }}/files?per_page=100"
            method: GET
            headers:
              Authorization: "Bearer {{ github_token }}"
              Accept: application/vnd.github+json
            status_code: [200]

        - name: End play early when no app/ files were changed
          when: pr_files_result.json | map(attribute='filename') | select('match', '^app/') | list | length == 0
          vars:
            github_status_state: success
            github_status_description: "Skipped — no app/ changes detected"
          block:
            - name: Post a success status so the PR check is not left pending
              ansible.builtin.include_role:
                name: demo.lightwell.report_status

            - name: End play
              ansible.builtin.meta: end_play

    - name: Mark the GitHub status check as pending (Test only)
      when: app_environment == 'test'
      vars:
        github_status_state: pending
        github_status_description: "Building application image for {{ app_environment }}"
      ansible.builtin.include_role:
        name: demo.lightwell.report_status

    - name: Build the application image (Test only)
      when: app_environment == 'test'
      ansible.builtin.include_role:
        name: demo.lightwell.build_app

- name: Deploy and verify the Lightwell demo application
  hosts: "{{ ('env_' ~ app_environment) if app_environment is defined else omit }}"
  gather_facts: false
  pre_tasks:
    - name: Check whether the push commit touches app/ files (Prod only)
      when:
        - app_environment == 'prod'
        - github_token is defined
        - github_repo_full_name is defined
        - app_git_sha is defined
      block:
        - name: Fetch the list of files changed in the commit
          register: commit_files_result
          ansible.builtin.uri:
            url: "{{ github_api_url | default('https://api.github.com') }}/repos/{{ github_repo_full_name }}/commits/{{ app_git_sha }}"
            method: GET
            headers:
              Authorization: "Bearer {{ github_token }}"
              Accept: application/vnd.github+json
            status_code: [200]

        - name: End play early when no app/ files were changed
          when: commit_files_result.json.files | map(attribute='filename') | select('match', '^app/') | list | length == 0
          vars:
            github_status_state: success
            github_status_description: "Skipped — no app/ changes detected"
          block:
            - name: Post a success status so the commit check is not left pending
              ansible.builtin.include_role:
                name: demo.lightwell.report_status

            - name: End play
              ansible.builtin.meta: end_play

    - name: Mark the GitHub status check as pending (Prod only)
      when: app_environment == 'prod'
      vars:
        github_status_state: pending
        github_status_description: "Deploying to {{ app_environment }}"
      ansible.builtin.include_role:
        name: demo.lightwell.report_status

  roles:
    - name: Deploy the application
      role: demo.lightwell.deploy_app

  tasks:
    - name: Run the post-deploy health check
      vars:
        health_check_strict: "{{ true if app_environment == 'test' else false }}"
      ansible.builtin.include_role:
        name: demo.lightwell.health_check

    - name: Record the initial deployment health result
      ansible.builtin.set_fact:
        initial_health_check_passed: "{{ health_check_passed }}"

    - name: Roll back automatically when the initial health check fails (Prod only)
      when:
        - app_environment == 'prod'
        - not initial_health_check_passed
      ansible.builtin.include_role:
        name: demo.lightwell.rollback

    - name: Report the final GitHub status check result
      vars:
        github_status_state: "{{ 'success' if health_check_passed else 'failure' }}"
        github_status_description: >-
          {{ app_environment | capitalize }} deployment {{ 'healthy' if health_check_passed
             else ('failed -- rolled back' if (app_environment == 'prod' and not initial_health_check_passed and rollback_image is defined)
                   else 'failed health checks') }}
      ansible.builtin.include_role:
        name: demo.lightwell.report_status

    - name: Surface the outcome for AAP job output
      ansible.builtin.debug:
        msg: >-
          {{ app_environment | capitalize }} deployment {{ 'PASSED' if health_check_passed else 'FAILED' }}
          for image {{ app_image_registry }}/{{ app_image_name }}:{{ app_image_tag }}.

    - name: Fail the play if unhealthy after any rollback attempt
      when: not health_check_passed
      ansible.builtin.fail:
        msg: "{{ app_environment | capitalize }} deployment failed health checks."
