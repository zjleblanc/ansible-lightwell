---
extends: default

yaml-files:
  - "*.yaml"
  - "*.yml"
  - ".yamllint.yml"

ignore: |
  collections/

rules:
  line-length:
    max: 220
    level: warning
  indentation:
    spaces: 2
    indent-sequences: true
  truthy:
    allowed-values: ["true", "false"]
  comments:
    min-spaces-from-content: 1
  # Required to stay compatible with ansible-lint's yamllint integration.
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
