target-version = "py312"
line-length = 100
src = ["app"]
exclude = [
  ".venv",
  "__pycache__",
  "collections",
]

[lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM"]
ignore = [
  "S104", # binding to 0.0.0.0 is required for the app to be reachable inside its container
]

[lint.per-file-ignores]
"app/tests/*" = ["S101"] # assert usage is expected in pytest test files

[format]
quote-style = "double"
indent-style = "space"
